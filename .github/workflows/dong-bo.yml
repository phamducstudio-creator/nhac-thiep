# Tự lấy nhạc studio bỏ vào thư mục Google Drive → đổi mp3 → cập nhật list.json → đăng lên GitHub Pages.
# Chạy ~10 phút/lần; bấm "Run workflow" ở tab Actions để chạy ngay.
name: Dong bo nhac tu Google Drive

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['list.json', 'n/**', '.giu-lich']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dong-bo-nhac
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: '1Wye8OP8fQau_MgFnVTdkgWx2JDcloJ1H'

jobs:
  dong-bo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cai thu vien
        run: pip install -q -r requirements.txt

      - name: Dong bo
        id: sync
        run: python tools/dong_bo.py

      - name: Luu thay doi
        if: steps.sync.outputs.changed == '1'
        run: |
          git config user.name "dong-bo-nhac"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A list.json n
          git commit -q -m "Dong bo nhac: ${{ steps.sync.outputs.summary }}"
          git push -q

      - name: Giu lich chay (GitHub tat lich neu kho im 60 ngay)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now-last)) -gt $((40*86400)) ]; then
            git config user.name "dong-bo-nhac"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .giu-lich
            git add .giu-lich && git commit -q -m "Giu lich tu dong bo" && git push -q
          fi

      - name: Dong goi trang
        if: steps.sync.outputs.changed == '1' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  trien-khai:
    needs: dong-bo
    if: needs.dong-bo.outputs.changed == '1' || github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
