# Kho nhạc thiệp cưới: (1) file tải thẳng lên tai-len/ (chung) hoặc tai-len/rieng/ (riêng) → chạy ngay khi Commit;
# (2) thư mục Google Drive → ~10 phút/lần. Đổi mp3 → cập nhật list.json → đăng lên GitHub Pages.
# Bấm "Run workflow" ở tab Actions để chạy ngay. Đẩy lỗi (có lần tải khác chen vào) thì lấy bản mới nhất rồi làm lại.
name: Dong bo nhac tu Google Drive

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['list.json', 'n/**', '.giu-lich']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dong-bo-nhac
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: '1Wye8OP8fQau_MgFnVTdkgWx2JDcloJ1H'

jobs:
  dong-bo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cai thu vien
        run: pip install -q -r requirements.txt

      - name: Dong bo
        id: sync
        run: python tools/dong_bo.py

      - name: Luu thay doi
        if: steps.sync.outputs.changed == '1'
        env:
          TOM_TAT: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "dong-bo-nhac"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            if [ "$i" -gt 1 ]; then
              sleep $((i * 4))
              git fetch -q origin main && git reset -q --hard origin/main
              python tools/dong_bo.py > /dev/null
            fi
            git add -A list.json tai-len
            git add -A n 2>/dev/null || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Dong bo nhac: $TOM_TAT"
            if git push -q origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Giu lich chay (GitHub tat lich neu kho im 60 ngay)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now-last)) -gt $((40*86400)) ]; then
            git config user.name "dong-bo-nhac"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .giu-lich
            git add .giu-lich && git commit -q -m "Giu lich tu dong bo" && git push -q origin HEAD:main
          fi

      - name: Dong goi trang
        if: steps.sync.outputs.changed == '1' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  trien-khai:
    needs: dong-bo
    if: needs.dong-bo.outputs.changed == '1' || github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
